name: Endor Labs - Go SCA Scan on PR
on:
  workflow_dispatch:

jobs:
  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
        
        - name: Checkout Repository
          uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
          
        - name: Setup Go
          uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
          with:
            go-version: '1.22.4'
          
        - name: Go Build 
          run: |
            
            export GO111MODULE=on
            export GOFLAGS=-modfile=golang/go.mod
            go build
          
        - name: Endor Labs SCA Scan
          uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e
          with:
            namespace: "matt-demo"
            api: "https://api.endorlabs.com"
            scan_summary_output_type: "table"
            enable_github_action_token: true
            scan_dependencies: true
            #scan_secrets: true
            #scan_git_logs: true
            #additional_args: "--tools --github --ghactions"
            tags: "actor = ${{ github.actor }},run-id = ${{ github.run_id }},event name = ${{ github.event_name }},workflow = ${{ github.workflow }},github sha = ${{ github.sha }}"