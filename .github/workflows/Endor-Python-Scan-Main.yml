name: Endor Labs - Python SCA Scan on Main Branch
on:
  workflow_dispatch
    
jobs:
  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:

        - name: Checkout Repository
          uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
          
        - name: Set up Python 3.11
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
          with:
            python-version: '3.11'
            cache: 'pip'
    
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r endor-python-demo/requirements.txt
            
        - name: Endor Labs SCA Scan
          uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e
          with:
            namespace: "matt-demo"
            api: "https://api.endorlabs.com"
            pr: false
            enable_github_action_token: true
            scan_dependencies: true
            #scan_secrets: true
            #scan_git_logs: true
            additional_args: "--as-default-branch" #--tools --github --ghactions
