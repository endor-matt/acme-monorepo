name: Endor Labs - SCA Scan on PR
on:
  workflow_dispatch
    
jobs:
  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:

        - name: Checkout Repository
          uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
          
        - name: Set up Python 3.11
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
          with:
            python-version: '3.11'
            cache: 'pip'
    
        - name: Install Python Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r endor-python-demo/requirements.txt

        - name: Setup Java
          uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
          with:
            distribution: microsoft
            java-version: "17"

        - name: Compile Java Package
          run: mvn -f java/pom.xml clean install

        - name: Setup Node
          uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
          with:
            node-version: 18
          
        - name: Build npm Dependencies
          run: npm --prefix javascript ci

        - name: Setup Go
          uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
          with:
            go-version: '1.22.4'
          
        - name: Go Build 
          run: |
            
            export GO111MODULE=on
            export GOFLAGS=-modfile=golang/go.mod
            go build
            
        - name: Endor Labs SCA Scan
          uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e
          with:
            namespace: "matt-demo"
            api: "https://api.endorlabs.com"
            scan_summary_output_type: "table"
            enable_github_action_token: true
            scan_dependencies: true
            #scan_secrets: true
            #scan_git_logs: true
            #additional_args: "--tools --github --ghactions"
            tags: "actor = ${{ github.actor }},run-id = ${{ github.run_id }},event name = ${{ github.event_name }},workflow = ${{ github.workflow }},github sha = ${{ github.sha }}"