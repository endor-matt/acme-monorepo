name: Endor Labs - Go SCA Scan on Main Branch
on:
  workflow_dispatch:

jobs:
  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
        
        - name: Checkout Repository
          uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
          
        - name: Setup Go
          uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
          with:
            go-version: '1.22.4'
          
        - name: Go Build 
          run: |

            cd golang
            go build .
            cd
          
        - name: Endor Labs SCA Scan
          uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e
          with:
            namespace: "matt-demo"
            api: "https://api.endorlabs.com"
            pr: false
            enable_github_action_token: true
            scan_dependencies: true
            #scan_secrets: true
            #scan_git_logs: true
            additional_args: "--as-default-branch" #--tools --github --ghactions